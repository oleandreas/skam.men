<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>skam.men</title>
    <meta name="description" content="Direkte fra Molineux." />
    <meta property="og:title" content="skam.men" />
    <meta property="og:description" content="Direkte fra Molineux." />
    <meta property="og:image" content="https://skam.men/vinai-and-johan.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skam.men/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20fill='%23d6293e'/%3E%3Ctext%20x='32'%20y='44'%20text-anchor='middle'%20font-family='Arial%20Black'%20font-size='28'%20fill='white'%20font-weight='900'%3ES%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="broadcast">
      <header class="bar">
        <div class="logo">
          <span class="logo__mark">S</span>
          <span class="logo__text">skam.men</span>
        </div>
        <div class="bar__meta">
          <span class="live"><i></i>DIREKTE</span>
          <time id="clock" class="clock">--:--</time>
        </div>
      </header>

      <figure class="frame">
        <img
          src="vinai-and-johan.jpg"
          alt="Vinai Venkatesham i baby-blå flosshatt og Johan Lange i oransje flosshatt på tribunen mens Wolves spiller 0-0 mot Tottenham"
        />

        <div class="lower-third">
          <div class="lt__tag">EKSKLUSIVT</div>
          <h1 class="lt__head">Spurs-direktørene fotografert på Molineux</h1>
          <p class="lt__sub">
            Vinai Venkatesham og Johan Lange fulgte kampen mot Wolves fra
            tribunen. Klubben har foreløpig ikke ønsket å kommentere
            antrekkene.
          </p>
        </div>

        <div class="bug" aria-hidden="true">
          <span class="bug__no">NO</span>
          <span class="bug__hd">HD</span>
        </div>
      </figure>

    </main>

    <script>
      const clock = document.getElementById('clock');
      const tick = () => {
        const d = new Date();
        clock.textContent =
          String(d.getHours()).padStart(2, '0') + ':' +
          String(d.getMinutes()).padStart(2, '0');
      };
      tick();
      setInterval(tick, 15000);
    </script>
  </body>
</html>
